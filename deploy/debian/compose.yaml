name: conlact

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-conlact}
      POSTGRES_USER: ${POSTGRES_USER:-conlact}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../../../conlact-backend/docker/init/00_auth_compat.sql:/docker-entrypoint-initdb.d/00_auth_compat.sql:ro
      - ../../../conlact-backend/docker/init/01_CONLACT_Modelo_Base.sql:/docker-entrypoint-initdb.d/01_CONLACT_Modelo_Base.sql:ro
      - ../../../conlact-backend/docker/init/02_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
      - ../../../conlact-backend/docker/init/03_storage_buckets.sql:/docker-entrypoint-initdb.d/03_storage_buckets.sql:ro
      - ../../../conlact-backend/docker/init/04_association_images.sql:/docker-entrypoint-initdb.d/04_association_images.sql:ro
      - ../../../conlact-backend/docker/init/05_extend_testimonials.sql:/docker-entrypoint-initdb.d/05_extend_testimonials.sql:ro
      - ../../../conlact-backend/docker/init/06_cms_and_editorial_content.sql:/docker-entrypoint-initdb.d/06_cms_and_editorial_content.sql:ro
      - ../../../conlact-backend/supabase/migrations/20261115_email_outbox_and_profiles.sql:/docker-entrypoint-initdb.d/07_email_outbox_and_profiles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [app]

  backend:
    build:
      context: ../../../conlact-backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-conlact}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-conlact}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD}
      SPRING_JPA_SHOW_SQL: "false"
      CORS_ALLOWED_ORIGINS: ${APP_ORIGIN:?Configura APP_ORIGIN}
      SUPABASE_URL: ${SUPABASE_URL:?Configura SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:?Configura SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?Usa una clave rotada}
      SUPABASE_JWT_PUBLIC_KEY: ${SUPABASE_JWT_PUBLIC_KEY:-}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-}
      SUPABASE_JWT_ISSUER: ${SUPABASE_URL}/auth/v1
      STORAGE_PRODUCT_BUCKET: ${STORAGE_PRODUCT_BUCKET:-product-images}
      STORAGE_RECIPE_BUCKET: ${STORAGE_RECIPE_BUCKET:-recipe-images}
      STORAGE_PAYMENT_BUCKET: ${STORAGE_PAYMENT_BUCKET:-payment-proofs}
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_FROM: ${MAIL_FROM:?Configura MAIL_FROM}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-CONLAC-T}
      MAIL_ADMIN_RECIPIENT: ${MAIL_ADMIN_RECIPIENT:?Configura MAIL_ADMIN_RECIPIENT}
      SMTP_HOST: ${SMTP_HOST:?Configura SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:?Configura SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?Configura SMTP_PASSWORD}
      SMTP_AUTH: ${SMTP_AUTH:-true}
      SMTP_STARTTLS_ENABLED: ${SMTP_STARTTLS_ENABLED:-true}
      SMTP_SSL_ENABLED: ${SMTP_SSL_ENABLED:-false}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/actuator/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 12
    networks: [app]

  frontend:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BACKEND_URL: ${APP_ORIGIN}/backend/api
        NEXT_PUBLIC_APP_URL: ${APP_ORIGIN}
        NEXT_PUBLIC_APP_NAME: CONLAC-T
        NEXT_PUBLIC_WHATSAPP_NUMBER: ${WHATSAPP_NUMBER:?Configura WHATSAPP_NUMBER}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      BACKEND_API_URL: http://backend:8080/api
      CONTENT_DB_DIR: /app/data
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM:?Configura SMTP_FROM}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:?Configura INITIAL_ADMIN_EMAIL}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:?Configura INITIAL_ADMIN_PASSWORD}
    volumes:
      - sqlite-data:/app/data
    networks: [app]

  proxy:
    image: nginx:stable-alpine
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    ports:
      - "${BIND_IP:-0.0.0.0}:${FRONT_PORT:-3079}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [app]

volumes:
  postgres-data:
  sqlite-data:

networks:
  app:
    driver: bridge
