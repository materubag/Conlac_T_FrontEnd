map $http_x_forwarded_proto $conlact_forwarded_proto {
    default $scheme;
    https https;
    http http;
}

map $http_upgrade $conlact_connection {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 32m;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript application/xml text/xml text/x-component image/svg+xml;
    # Stream responses rather than spilling large upstream bodies to temp files.
    proxy_max_temp_file_size 0;

    # Resolver de Docker: soporta recrear los contenedores sin fijar sus IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $conlact_frontend frontend:3000;
    set $conlact_backend backend:8080;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $conlact_forwarded_proto;
    proxy_set_header X-Forwarded-For $remote_addr;
    # Keep all proxy headers at the same level: location overrides their inheritance.
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $conlact_connection;
    proxy_read_timeout 90s;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Este despliegue conserva identidad/admin en Next + SQLite.
    # No publica autenticacion Java ni webhooks descartados de pagos.
    location ~ ^/backend/api/(?:auth|admin|webhooks?)(?:/|$) {
        return 404;
    }
    # New orders use Next + SQLite. Legacy orders are read internally by UUID.
    # Do not expose the old sequential-number tracker or a second checkout.
    location ~ ^/backend/api/(?:orders|pedidos)(?:/|$) {
        return 404;
    }

    location /backend/api/ {
        rewrite ^/backend/(.*)$ /$1 break;
        proxy_pass http://$conlact_backend;
    }

    location /backend/ {
        return 404;
    }

    location / {
        proxy_pass http://$conlact_frontend;
    }
}
