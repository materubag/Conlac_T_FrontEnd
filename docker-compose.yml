# Ejecutar desde este directorio: docker compose up -d --build
# Las variables p?blicas se incorporan al compilar; requieren --build al cambiarlas.
services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-${BACKEND_URL:-http://localhost:8080/api}}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-${APP_NAME:-CONLAC-T}}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-${APP_URL:-http://localhost:3000}}
        NEXT_PUBLIC_WHATSAPP_NUMBER: ${NEXT_PUBLIC_WHATSAPP_NUMBER:-${WHATSAPP_NUMBER:-593987654321}}
        NEXT_PUBLIC_WHATSAPP_DEFAULT_MESSAGE: ${NEXT_PUBLIC_WHATSAPP_DEFAULT_MESSAGE:-}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-${SUPABASE_URL:-}}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-${SUPABASE_ANON_KEY:-}}
        NEXT_PUBLIC_BANK_NAME: ${NEXT_PUBLIC_BANK_NAME:-}
        NEXT_PUBLIC_BANK_ACCOUNT_TYPE: ${NEXT_PUBLIC_BANK_ACCOUNT_TYPE:-}
        NEXT_PUBLIC_BANK_ACCOUNT_NUMBER: ${NEXT_PUBLIC_BANK_ACCOUNT_NUMBER:-}
        NEXT_PUBLIC_BANK_BENEFICIARY: ${NEXT_PUBLIC_BANK_BENEFICIARY:-}
        NEXT_PUBLIC_BANK_RUC: ${NEXT_PUBLIC_BANK_RUC:-}
        NEXT_PUBLIC_BANK_EMAIL: ${NEXT_PUBLIC_BANK_EMAIL:-}
    image: conlact-frontend:latest
    container_name: conlact-frontend
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - path: .env
        required: false
    environment:
      # El navegador usa localhost:8080; el servidor dentro de Docker usa el host.
      BACKEND_API_URL: ${DOCKER_BACKEND_API_URL:-http://host.docker.internal:8080/api}
    extra_hosts:
      - "host.docker.internal:host-gateway"
