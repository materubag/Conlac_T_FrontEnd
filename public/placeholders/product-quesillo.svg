<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FBF8F1"/>
      <stop offset="100%" stop-color="#EFE7D5"/>
    </linearGradient>
    <linearGradient id="quesilloGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F4EFE0"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#4A3728" flood-opacity="0.12"/>
    </filter>
  </defs>
  <!-- Background Board -->
  <rect width="600" height="500" rx="16" fill="url(#bgGrad)"/>
  <circle cx="300" cy="240" r="170" fill="#E6D7BD" opacity="0.4"/>
  
  <!-- Achira Leaf Base (Traditional Wrapping) -->
  <path d="M120,330 C160,280 320,290 480,340 C380,390 200,380 120,330 Z" fill="#2D6A4F" opacity="0.85" filter="url(#dropShadow)"/>
  <path d="M130,330 Q290,325 470,340" stroke="#52B788" stroke-width="2" fill="none" opacity="0.6"/>

  <!-- Quesillo Soft Forms -->
  <g filter="url(#dropShadow)">
    <ellipse cx="270" cy="250" rx="90" ry="50" fill="url(#quesilloGrad)"/>
    <ellipse cx="340" cy="235" rx="85" ry="45" fill="url(#quesilloGrad)"/>
    <ellipse cx="300" cy="230" rx="80" ry="40" fill="#FFFFFF"/>
  </g>
  
  <!-- Soft Texture lines -->
  <path d="M230,240 Q270,260 320,245" stroke="#E6DEC9" stroke-width="2" fill="none"/>
  <path d="M280,225 Q320,240 370,230" stroke="#E6DEC9" stroke-width="2" fill="none"/>

  <!-- Artisan Tag / Stamp -->
  <rect x="230" y="385" width="140" height="34" rx="17" fill="#184332"/>
  <text x="300" y="407" fill="#F8F4E9" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="1">QUESILLO</text>
</svg>
