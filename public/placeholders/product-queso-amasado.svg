<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FBF8F1"/>
      <stop offset="100%" stop-color="#EFE7D5"/>
    </linearGradient>
    <linearGradient id="amasadoGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF8"/>
      <stop offset="100%" stop-color="#F3E9D2"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#4A3728" flood-opacity="0.12"/>
    </filter>
  </defs>
  <!-- Background Board -->
  <rect width="600" height="500" rx="16" fill="url(#bgGrad)"/>
  <circle cx="300" cy="240" r="170" fill="#E6D7BD" opacity="0.4"/>
  
  <!-- Artisan Clay Plate Base -->
  <ellipse cx="300" cy="330" rx="190" ry="42" fill="#C58F5E" opacity="0.35" filter="url(#dropShadow)"/>
  
  <!-- Queso Amasado Traditional Block -->
  <g filter="url(#dropShadow)">
    <path d="M190,210 C190,195 240,175 300,175 C360,175 410,195 410,210 L410,290 C410,315 360,335 300,335 C240,335 190,315 190,290 Z" fill="#E5D9C2"/>
    <path d="M190,210 C190,230 240,250 300,250 C360,250 410,230 410,210" fill="none" stroke="#D3C4A9" stroke-width="2"/>
    <ellipse cx="300" cy="210" rx="110" ry="40" fill="url(#amasadoGrad)"/>
  </g>
  
  <!-- Handmade Kneaded textures / layers -->
  <path d="M220,205 Q260,225 320,210" stroke="#DFCFAF" stroke-width="3" fill="none" opacity="0.8"/>
  <path d="M250,220 Q290,235 360,220" stroke="#DFCFAF" stroke-width="3" fill="none" opacity="0.8"/>
  <path d="M210,250 Q280,285 390,260" stroke="#D3C4A9" stroke-width="2" fill="none" opacity="0.7"/>

  <!-- Artisan Tag / Stamp -->
  <rect x="210" y="385" width="180" height="34" rx="17" fill="#184332"/>
  <text x="300" y="407" fill="#F8F4E9" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="1">QUESO AMASADO</text>
</svg>
