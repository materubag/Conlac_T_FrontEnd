<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="recipeBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDF8F2"/>
      <stop offset="100%" stop-color="#F2E6D8"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="16" fill="url(#recipeBg)"/>
  
  <!-- Cooking Pot / Traditional Dish with Melted Cheese -->
  <ellipse cx="300" cy="270" rx="160" ry="40" fill="#4A3728" opacity="0.15"/>
  <ellipse cx="300" cy="240" rx="140" ry="70" fill="#7C4724"/>
  <ellipse cx="300" cy="230" rx="130" ry="60" fill="#B87D47"/>
  <ellipse cx="300" cy="225" rx="115" ry="50" fill="#F4DCC4"/>

  <!-- Golden Melted Cheese / Locro de Papa & Queso -->
  <ellipse cx="300" cy="220" rx="100" ry="40" fill="#F6C85F"/>
  <ellipse cx="280" cy="215" rx="35" ry="15" fill="#FFF2B2"/>
  
  <!-- Avocado / Herb garnish -->
  <circle cx="340" cy="210" r="14" fill="#2D6A4F"/>
  <circle cx="330" cy="225" r="10" fill="#52B788"/>
  <circle cx="260" cy="225" r="12" fill="#E76F51"/>

  <!-- Steam curves -->
  <path d="M260,160 Q250,130 270,100" stroke="#D4A373" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M300,150 Q315,120 295,90" stroke="#D4A373" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8"/>
  <path d="M340,160 Q330,130 350,100" stroke="#D4A373" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>

  <!-- Badge -->
  <rect x="210" y="325" width="180" height="34" rx="17" fill="#184332"/>
  <text x="300" y="347" fill="#F8F4E9" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="1">RECETAS ANDINAS</text>
</svg>
