<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="tourBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8F4F8"/>
      <stop offset="60%" stop-color="#D9EBF1"/>
      <stop offset="100%" stop-color="#C2DFEA"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="16" fill="url(#tourBg)"/>
  
  <!-- Volcano Chimborazo / Carihuairazo near Pilahuín -->
  <polygon points="300,70 120,300 480,300" fill="#6C8D7B"/>
  <polygon points="300,70 240,160 275,145 300,170 330,140 360,160" fill="#FFFFFF"/>

  <!-- Green Paramo Hills & Trails -->
  <path d="M-50,320 Q200,220 650,300 L650,400 L-50,400 Z" fill="#3D6E53"/>
  <path d="M-50,350 Q300,280 650,350 L650,400 L-50,400 Z" fill="#254B37"/>

  <!-- Compass / Pin icon -->
  <circle cx="490" cy="90" r="44" fill="#184332"/>
  <circle cx="490" cy="90" r="38" fill="none" stroke="#D4A373" stroke-width="2"/>
  <!-- Map Pin -->
  <path d="M490,68 C481,68 474,75 474,84 C474,96 490,112 490,112 C490,112 506,96 506,84 C506,75 499,68 490,68 Z" fill="#D4A373"/>
  <circle cx="490" cy="84" r="4" fill="#184332"/>

  <!-- Badge -->
  <rect x="200" y="330" width="200" height="34" rx="17" fill="#184332"/>
  <text x="300" y="352" fill="#F8F4E9" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="1">TURISMO COMUNITARIO</text>
</svg>
