<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="assocBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8F1EC"/>
      <stop offset="100%" stop-color="#C5D9CE"/>
    </linearGradient>
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D4A373"/>
      <stop offset="100%" stop-color="#B87D47"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="16" fill="url(#assocBg)"/>
  
  <!-- Andean Barn / Community Dairy Plant -->
  <!-- Mountain backdrop -->
  <polygon points="120,240 240,110 360,240" fill="#9FB5A9" opacity="0.6"/>
  <polygon points="280,240 420,90 560,240" fill="#8DA698" opacity="0.7"/>

  <!-- Field -->
  <path d="M0,220 Q300,180 600,220 L600,400 L0,400 Z" fill="#4B785F"/>
  <path d="M0,260 Q300,240 600,270 L600,400 L0,400 Z" fill="#356149"/>

  <!-- Cooperative Building -->
  <polygon points="210,210 300,140 390,210" fill="url(#roofGrad)"/>
  <rect x="230" y="210" width="140" height="100" fill="#F8F4E9"/>
  <!-- Door & Windows -->
  <rect x="280" y="250" width="40" height="60" rx="4" fill="#184332"/>
  <rect x="245" y="230" width="25" height="25" rx="2" fill="#D4A373"/>
  <rect x="330" y="230" width="25" height="25" rx="2" fill="#D4A373"/>

  <!-- Sello Comunitario -->
  <circle cx="490" cy="90" r="50" fill="#184332"/>
  <circle cx="490" cy="90" r="44" fill="none" stroke="#D4A373" stroke-width="2"/>
  <text x="490" y="88" fill="#F8F4E9" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">ASOCIACIÓN</text>
  <text x="490" y="102" fill="#D4A373" font-family="sans-serif" font-size="9" font-weight="600" text-anchor="middle">PILAHUÍN</text>
</svg>
