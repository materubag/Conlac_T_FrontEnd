<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FBF8F1"/>
      <stop offset="100%" stop-color="#EFE7D5"/>
    </linearGradient>
    <linearGradient id="rindGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C2843E"/>
      <stop offset="100%" stop-color="#93581F"/>
    </linearGradient>
    <linearGradient id="maduroGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFDE7A"/>
      <stop offset="100%" stop-color="#E5AF36"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#4A3728" flood-opacity="0.12"/>
    </filter>
  </defs>
  <!-- Background Board -->
  <rect width="600" height="500" rx="16" fill="url(#bgGrad)"/>
  <circle cx="300" cy="240" r="170" fill="#E6D7BD" opacity="0.4"/>
  
  <!-- Rustic Wood Board -->
  <ellipse cx="300" cy="330" rx="210" ry="40" fill="#7C4724" opacity="0.4" filter="url(#dropShadow)"/>

  <!-- Aged Cheese Wheel with Wedge Cut -->
  <g filter="url(#dropShadow)">
    <!-- Base Cylindrical Wheel with Aged Rind -->
    <path d="M160,200 C160,175 220,155 300,155 C380,155 440,175 440,200 L440,270 C440,295 380,315 300,315 C220,315 160,295 160,270 Z" fill="url(#rindGrad)"/>
    <ellipse cx="300" cy="200" rx="140" ry="45" fill="url(#maduroGrad)"/>
    
    <!-- Cut Wedge Highlight (Golden interior) -->
    <polygon points="300,200 370,185 390,265 300,285" fill="#FFEC9E"/>
    <polygon points="300,200 330,235 330,315 300,285" fill="#ECC358"/>
    <line x1="300" y1="200" x2="300" y2="285" stroke="#CCA033" stroke-width="2"/>
  </g>
  
  <!-- Aged Eyes / Holes -->
  <circle cx="330" cy="220" r="5" fill="#D3A534"/>
  <circle cx="360" cy="210" r="4" fill="#D3A534"/>
  <circle cx="345" cy="250" r="6" fill="#D3A534"/>

  <!-- Artisan Tag / Stamp -->
  <rect x="200" y="385" width="200" height="34" rx="17" fill="#184332"/>
  <text x="300" y="407" fill="#F8F4E9" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="1">MADURO ANDINO</text>
</svg>
